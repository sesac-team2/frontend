<svg width="512" height="512" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Proov icon">
  <defs>
    <linearGradient id="gTop" x1="40" y1="30" x2="216" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B7FF4A"/>
      <stop offset="1" stop-color="#24D48A"/>
    </linearGradient>
    <linearGradient id="gMid" x1="30" y1="70" x2="226" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FE8A1"/>
      <stop offset="1" stop-color="#10B6D8"/>
    </linearGradient>
    <linearGradient id="gBot" x1="25" y1="115" x2="231" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1CC0FF"/>
      <stop offset="1" stop-color="#2563FF"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <linearGradient id="shine" x1="80" y1="40" x2="160" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Group shadow -->
  <g filter="url(#softShadow)">
    <!-- Bottom layer -->
    <path
      d="M128 178 L54 140 L128 102 L202 140 Z"
      fill="url(#gBot)"
    />
    <path
      d="M54 140 L128 178 L128 212 L54 174 Z"
      fill="#1E4FE0"
      opacity="0.25"
    />
    <path
      d="M202 140 L128 178 L128 212 L202 174 Z"
      fill="#0A2F9A"
      opacity="0.18"
    />

    <!-- Middle layer -->
    <path
      d="M128 132 L66 100 L128 70 L190 100 Z"
      fill="url(#gMid)"
    />
    <path
      d="M66 100 L128 132 L128 160 L66 128 Z"
      fill="#0C8FB0"
      opacity="0.22"
    />
    <path
      d="M190 100 L128 132 L128 160 L190 128 Z"
      fill="#0A6A84"
      opacity="0.18"
    />

    <!-- Top layer -->
    <path
      d="M128 88 L80 62 L128 36 L176 62 Z"
      fill="url(#gTop)"
    />
    <path
      d="M80 62 L128 88 L128 112 L80 86 Z"
      fill="#1AAE6B"
      opacity="0.22"
    />
    <path
      d="M176 62 L128 88 L128 112 L176 86 Z"
      fill="#138E55"
      opacity="0.18"
    />

    <!-- subtle highlight -->
    <path
      d="M128 40 L168 62 L128 84 L88 62 Z"
      fill="url(#shine)"
      opacity="0.7"
    />
  </g>
</svg>
